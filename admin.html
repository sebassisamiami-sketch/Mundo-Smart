<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel · Mundo Smart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="css/admin.css?v=9">
</head>
<body>

<!-- ======== LOGIN ======== -->
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="login-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>
    </div>
    <h1 class="login-logo">Mundo <span>Smart</span></h1>
    <p class="login-sub">Panel de administración<br>Acceso solo para el administrador autorizado</p>
    <div id="loginErr" class="login-err hidden"></div>
    <button id="googleBtn" class="gbtn">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Entrar con Google
    </button>
    <div class="badge2fa">
      <svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Verificación en 2 pasos requerida
    </div>
    <p class="login-note" id="loginNote"></p>
  </div>
</div>

<!-- ======== PANEL ======== -->
<div id="appView" class="hidden">
  <div class="topbar">
    <div class="brand">Mundo <span>Smart</span> · Panel</div>
    <div class="top-right">
      <span id="sessionTag" class="session-tag"></span>
      <div class="who"><img id="whoImg" alt=""><span id="whoName"></span></div>
      <button id="logoutBtn" class="btn btn-danger">Cerrar sesión</button>
    </div>
  </div>

  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-tab="resumen"><svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg><span>Resumen</span></button>
      <button class="tab" data-tab="orders"><svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span>Pedidos</span></button>
      <button class="tab" data-tab="attempts"><svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>Intentos</span></button>
      <button class="tab" data-tab="clientes"><svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Clientes</span></button>
      <button class="tab" data-tab="editor"><svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg><span>Tienda</span></button>
    </div>

    <!-- Barra de Pedidos (persistente) -->
    <div class="toolbar hidden" id="ordersTools">
      <input id="search" type="search" placeholder="Buscar cliente, pedido, teléfono…">
      <select id="fStatus">
        <option value="">Todos los estados</option>
        <option value="nuevo">Nuevo</option>
        <option value="confirmado">Confirmado</option>
        <option value="despachado">Despachado</option>
        <option value="entregado">Entregado</option>
        <option value="cancelado">Cancelado</option>
      </select>
      <select id="fPay">
        <option value="">Todos los pagos</option>
        <option value="contraentrega">Contra entrega</option>
        <option value="wompi">Wompi</option>
      </select>
      <label class="dlabel">Desde <input id="fFrom" type="date"></label>
      <label class="dlabel">Hasta <input id="fTo" type="date"></label>
      <div class="spacer"></div>
      <button id="exportBtn" class="btn">⬇ CSV</button>
    </div>

    <!-- Barra de Intentos (persistente) -->
    <div class="toolbar hidden" id="attemptsTools">
      <select id="fAttempt">
        <option value="">Todos</option>
        <option value="abierto">Sin pagar</option>
        <option value="completado">Compraron</option>
      </select>
      <div class="spacer"></div>
      <button id="exportAtt" class="btn">⬇ CSV</button>
    </div>

    <div id="view">
      <div class="loading"><div class="spin"></div>Cargando…</div>
    </div>
  </div>
</div>

<div id="modal" class="modal-bg hidden"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js?v=2"></script>
<script src="js/config.js?v=21"></script>
<script src="js/products.js?v=22"></script>
<script src="js/legal-content.js?v=1"></script>
<script src="js/admin.js?v=5"></script>
<script src="js/admin-editor.js?v=5"></script>
</body>
</html>
