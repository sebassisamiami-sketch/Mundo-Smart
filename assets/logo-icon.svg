<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2440"/>
      <stop offset="1" stop-color="#090c16"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcd1ff"/>
      <stop offset="1" stop-color="#6f9bff"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a568f"/>
      <stop offset="1" stop-color="#24345e"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#223257"/>
      <stop offset="1" stop-color="#141d38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#5b8cff" stroke-opacity="0.18" stroke-width="2"/>

  <ellipse cx="256" cy="250" rx="180" ry="170" fill="url(#glow)"/>

  <!-- Cubo isométrico -->
  <g stroke-linejoin="round">
    <polygon points="256,66 420,161 256,256 92,161" fill="url(#top)"/>
    <polygon points="92,161 256,256 256,446 92,351" fill="url(#left)"/>
    <polygon points="420,161 420,351 256,446 256,256" fill="url(#right)"/>
    <!-- Aristas -->
    <g fill="none" stroke="#dce7ff" stroke-opacity="0.9" stroke-width="5">
      <polygon points="256,66 420,161 420,351 256,446 92,351 92,161"/>
    </g>
    <g fill="none" stroke="#9db8ff" stroke-opacity="0.65" stroke-width="4">
      <path d="M92,161 256,256 420,161 M256,256 256,446"/>
    </g>
  </g>
</svg>
